<!doctype html>
<html lang="ru">
  <body>
    <h2>Восстановление пароля</h2>
    <p>
      Перейдите по ссылке, чтобы установить новый пароль для
      AI Fitness Trainer:
    </p>
    <p>
      <a
        href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
      >
        Установить новый пароль
      </a>
    </p>
    <p>
      Если вы не запрашивали восстановление пароля, просто
      проигнорируйте это письмо.
    </p>
  </body>
</html>
